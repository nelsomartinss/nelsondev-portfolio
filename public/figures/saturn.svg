<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320">
  <defs>
    <radialGradient id="planet" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bdbdbd"/>
      <stop offset="0.8" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#e0e0e0"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="210" cy="160" r="92"/></clipPath>
  </defs>
  <g transform="rotate(-28 210 160)">
    <!-- back half of the rings, hidden behind the planet -->
    <g fill="none" stroke="url(#ring)">
      <path d="M40 160 A170 44 0 0 1 380 160" stroke-width="20"/>
      <path d="M64 160 A146 35 0 0 1 356 160" stroke-width="7" opacity="0.6"/>
    </g>
    <circle cx="210" cy="160" r="92" fill="url(#planet)"/>
    <!-- atmospheric bands -->
    <g clip-path="url(#disc)" fill="none" stroke="#000" stroke-opacity="0.35">
      <path d="M120 135 Q210 150 300 135" stroke-width="7"/>
      <path d="M120 175 Q210 192 300 175" stroke-width="10"/>
      <path d="M125 205 Q210 220 295 205" stroke-width="6"/>
    </g>
    <!-- front half of the rings, crossing over the planet; the dark band under it separates ring from sphere -->
    <path d="M40 160 A170 44 0 0 0 380 160" fill="none" stroke="#000" stroke-width="34"/>
    <g fill="none" stroke="url(#ring)">
      <path d="M40 160 A170 44 0 0 0 380 160" stroke-width="20"/>
      <path d="M64 160 A146 35 0 0 0 356 160" stroke-width="7" opacity="0.6"/>
    </g>
  </g>
</svg>
