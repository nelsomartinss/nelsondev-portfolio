<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0d0d0"/>
      <stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-6 200 190)">
    <!-- back panel with a tall tab -->
    <path d="M60 40 H160 L186 74 H328 Q342 74 342 88 V290 H60 Z" fill="url(#back)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- papers sticking out -->
    <g transform="rotate(-5 200 110)">
      <rect x="96" y="66" width="214" height="90" rx="4" fill="#fff"/>
      <path d="M116 88 H262 M116 106 H290 M116 124 H236" stroke="#4a4a4a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- dark gap that separates the front panel from everything behind it -->
    <path d="M42 134 L322 122 Q336 122 337 136 L350 302 Q351 316 337 316 L60 322 Q46 322 45 308 Z" fill="none" stroke="#000" stroke-width="30" stroke-linejoin="round"/>
    <!-- front panel, slightly in perspective -->
    <path d="M42 134 L322 122 Q336 122 337 136 L350 302 Q351 316 337 316 L60 322 Q46 322 45 308 Z" fill="url(#front)" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
    <!-- texture lines on the front panel -->
    <g stroke="#000" stroke-opacity="0.55" stroke-width="6">
      <path d="M104 172 L326 163 M106 200 L328 191 M108 228 L330 219 M110 256 L332 247 M112 284 L334 275"/>
    </g>
    <!-- label blocks -->
    <g fill="#fff">
      <rect x="62" y="160" width="28" height="16" rx="2"/>
      <rect x="63" y="186" width="28" height="16" rx="2"/>
      <rect x="64" y="212" width="28" height="16" rx="2"/>
      <rect x="65" y="238" width="20" height="16" rx="2"/>
    </g>
  </g>
</svg>
