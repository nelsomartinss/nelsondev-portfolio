<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7a7a7a"/>
    </linearGradient>
    <radialGradient id="body" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5a5a5a"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-18 210 150)">
    <!-- struts -->
    <path d="M150 150 H178 M242 150 H270" stroke="#bdbdbd" stroke-width="6"/>
    <!-- solar panels with cell grid -->
    <g fill="url(#panel)">
      <rect x="20" y="110" width="130" height="80" rx="3"/>
      <rect x="270" y="110" width="130" height="80" rx="3"/>
    </g>
    <g stroke="#2a2a2a" stroke-width="3">
      <path d="M52 110 V190 M85 110 V190 M118 110 V190 M20 137 H150 M20 163 H150"/>
      <path d="M302 110 V190 M335 110 V190 M368 110 V190 M270 137 H400 M270 163 H400"/>
    </g>
    <!-- body -->
    <rect x="178" y="118" width="64" height="64" rx="6" fill="url(#body)"/>
    <path d="M178 150 H242" stroke="#3a3a3a" stroke-width="3"/>
    <!-- dish and antenna -->
    <path d="M210 118 V96" stroke="#bdbdbd" stroke-width="5"/>
    <path d="M176 92 Q210 58 244 92 Z" fill="#d0d0d0"/>
    <path d="M210 82 V40" stroke="#e0e0e0" stroke-width="3"/>
    <circle cx="210" cy="38" r="6" fill="#fff"/>
  </g>
</svg>
